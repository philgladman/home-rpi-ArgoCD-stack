apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mattermost

resources:
  - postgresql/deployment.yaml
  - postgresql/service.yaml
  - postgresql/pvc.yaml
  - postgresql/pv.yaml
  - namespace.yaml
  - release.yaml

generatorOptions:
  disableNameSuffixHash: true

generators:
  - secret-generator.yaml
