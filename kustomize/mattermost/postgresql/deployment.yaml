apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mattermost-postgresql
  name: mattermost-postgresql
  namespace: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mattermost-postgresql
  template:
    metadata:
      labels:
        app: mattermost-postgresql
    spec:
      containers:
      - image: docker.io/postgres:15
        name: postgresql
        # envFrom:
        # - configMapRef:
        #     name: postgresql-configmap 
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgresql-credentials
                key: password
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgresql-credentials
                key: username
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: postgresql-credentials
                key: db_name
        # securityContext:
        #   privileged: true
        ports:        
          - containerPort: 5432
            protocol: TCP
            name: postgresql
        volumeMounts:
          - name: mattermost-postgresql
            mountPath: /var/lib/postgresql/data
      volumes:
        - name: mattermost-postgresql
          persistentVolumeClaim:
            claimName: mattermost-postgresql-claim

