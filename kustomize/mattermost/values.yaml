mattermost-operator:
  mattermostOperator:
    enabled: true
    replicas: 1
    rbac:
      create: true
    serviceAccount:
      create: true
    env:
      maxReconcilingInstallations: 20
      maxReconcilingConcurrency: 10
      requeuOnLimitDelay: 20s
    image:
      repository: mattermost/mattermost-operator
      tag: v1.22.0
      pullPolicy: IfNotPresent
    args:
      - --enable-leader-election
      - --metrics-addr=0.0.0.0:8383
  mattermostCR:
    enabled: true
    name: mattermost
    spec:
      version: 10.6.2
      replicas: 1
      ingress:
        enabled: true
        host: mattermost.phils-home.com
      database:
        external:
          secret:  mattermost-db-credentials
      fileStore:
        local:
          enabled: true
          storageSize: 5Gi
